schema: spec-driven
context: |
  ¿De qué color? is a Spanish, mobile-first static browser game.
  Native HTML/CSS/ES modules without browser dependencies or a frontend build.
  GitHub Pages serves the frontend; Cloudflare Workers and SQLite Durable Objects
  provide authenticated shared rooms without player accounts.
  Deployable at the root and a GitHub Pages subdirectory. The current catalogue
  has 2,000 approved questions across ten categories of 200, with all three levels.
  Preserve legacy saved games and immutable IDs when expanding the catalogue.
  Content must be original and factually reviewed before approval.
